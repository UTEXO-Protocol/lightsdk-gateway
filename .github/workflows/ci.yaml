name: CI

# CI for this pnpm workspace: the REST gateway (packages/gateway), the
# TypeScript client SDK that is the reference for its contract, and the e2e
# package's infra-free smoke test.
#
# This matters more than it looks. The gateway's HTTP surface has an
# out-of-repo consumer — the rgb-sdk-kotlin-light Android SDK — and its response
# schemas are strict, so removing or retyping a field is a breaking change for a
# client this repository cannot test against. The unit suites are the only guard
# on that contract, and they need nothing but Node.
#
# Deliberately NOT here: the regtest e2e journey (`pnpm e2e`) and the two
# WALLET_REGTEST gateway suites, which need the docker regtest stack in
# regtest/ — including an rgb-node-api image built with access to private
# UTEXO-Protocol repositories. They stay a local/manual step, as documented in
# README.md.

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Build, lint and test the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version`: the action reads `packageManager` from package.json, so CI
      # uses the same pnpm that wrote the lockfile.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # package.json engines and the gateway README require 20+.
          node-version: '20'
          cache: pnpm

      # --frozen-lockfile so a dependency change that was not committed to the
      # lockfile fails here rather than silently resolving to something else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint and format check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
